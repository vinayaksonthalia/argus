<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="sketch.css">
<style>
  body { --accent: #8B5CF6; }
  .title { font-size: 52px; }
  .badge { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:22px; color:var(--accent); z-index:3; }
  .phead { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:24px; color:var(--ink); z-index:3; }
  .pcap  { position:absolute; font-size:21px; color:var(--gray); line-height:1.3; z-index:3; }
  .pcap b { color:var(--ink); font-weight:normal; }
  .screen { padding:12px 16px; }
  .screen .label { font-size:23px; }
  .screen .sub { font-size:18px; }
  .cardtop { justify-content:flex-start; padding-top:12px; }
  .mono { font-family:"Courier New",monospace; font-size:16px; color:var(--gray); }
  .storycap { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:27px; color:var(--ink); text-align:center; width:100%; left:0; z-index:3; }
  .storycap .em { color:var(--accent); }
</style>
</head>
<body>
  <div class="title" style="left:56px; top:34px;">three ways it declines to answer</div>
  <div class="subtitle" style="left:60px; top:100px;">an investigation is allowed to end without a verdict. most of ours do. &mdash; ARGUS</div>

<script src="sketch.js"></script>
<script src="character.js"></script>
<script src="blog-strip.js"></script>
<script>
window.addEventListener("load", () => {
  Sketch.init();
  Sketch.underline(".title");
  const S = Strip, A = S.getAccent();

  // ---- panel 1: REFUTED ----------------------------------------------------
  S.frame(0); S.badge(0, 1);
  S.headline(0, "it kills its own theory");
  S.screen(0,
    '<div class="label stamp red-ink">REFUTED &#10007;</div>' +
    '<div class="sub mono">after/before ratio 0.77<br>(needed &gt; 1.3)</div>',
    56, 336, 124, "red", "var(--red)");
  S.character(0, "determined", { cy: 418 });
  S.caption(0, "the escape-hatch hypothesis<br><b>died to its own query.</b>");

  // ---- panel 2: DEGRADED ---------------------------------------------------
  S.frame(1); S.badge(1, 2);
  S.headline(1, "the check won't run");
  S.screen(1,
    '<div class="label">DEGRADED</div>' +
    '<div class="sub mono">verification matched 0 rows<br>/ the query 404s</div>',
    56, 336, 124, "cardtop");
  S.character(1, "puzzled", { cy: 420 });
  S.caption(1, "a check on a field that isn't there<br><b>costs the hypothesis, not the truth.</b>");

  // ---- panel 3: NEEDS REVIEW ----------------------------------------------
  S.frame(2); S.badge(2, 3);
  S.headline(2, "below the threshold");
  S.screen(2,
    '<div class="label">NEEDS REVIEW</div>' +
    '<div class="sub mono">confidence 60% &lt; 75%<br>hand it to a human</div>',
    56, 336, 124);
  S.character(2, "confident", { cy: 418 });
  S.caption(2, "no verdict is a result.<br><b>a confident wrong one isn't.</b>");

  [0, 1].forEach(i => S.seqArrow(i, 460));

  S.el("storycap",
    '1 of the 20 runs on the console cleared 75%. the other 19 <span class="em">said so</span>.',
    'top:690px;');

  window.__sketchDone = true;
});
</script>
</body>
</html>
