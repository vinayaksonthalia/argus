<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="sketch.css">
<style>
  body { --accent: #8B5CF6; }
  .title { font-size: 52px; }
  .badge { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:22px; color:var(--accent); z-index:3; }
  .phead { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:24px; color:var(--ink); z-index:3; }
  .pcap  { position:absolute; font-size:21px; color:var(--gray); line-height:1.3; z-index:3; }
  .pcap b { color:var(--ink); font-weight:normal; }
  .screen { padding:12px 16px; }
  .screen .label { font-size:23px; }
  .screen .sub { font-size:18px; }
  .cardtop { justify-content:flex-start; padding-top:12px; }
  .mono { font-family:"Courier New",monospace; font-size:16px; color:var(--gray); }
  .storycap { position:absolute; font-family:"Marker Felt","Chalkboard SE",cursive; font-size:27px; color:var(--ink); text-align:center; width:100%; left:0; z-index:3; }
  .storycap .em { color:var(--accent); }
</style>
</head>
<body>
  <div class="title" style="left:56px; top:34px;">the bug was one missing prefix</div>
  <div class="subtitle" style="left:60px; top:100px;">a bare field name where SigNoz's v5 query API wanted the context-qualified one. &mdash; ARGUS</div>

<script src="sketch.js"></script>
<script src="character.js"></script>
<script src="blog-strip.js"></script>
<script>
window.addEventListener("load", () => {
  Sketch.init();
  Sketch.underline(".title");
  const S = Strip, A = S.getAccent();

  // ---- panel 1: what we shipped -------------------------------------------
  S.frame(0); S.badge(0, 1);
  S.headline(0, "what we shipped");
  S.screen(0,
    '<div class="label">deployment&ndash;change filter</div>' +
    '<div class="sub mono">event.name = \'deployment\'</div>',
    56, 336, 124, "cardtop");
  S.character(0, "focused", { cy: 420 });
  S.caption(0, "correct-looking, and it parses<br><b>only if a deploy event exists.</b>");

  // ---- panel 2: what it actually did --------------------------------------
  S.frame(1); S.badge(1, 2);
  S.headline(1, "what it actually did");
  S.screen(1,
    '<div class="label red-ink">400 Bad Request</div>' +
    '<div class="sub mono">19 ms &middot; error=True<br>every investigation, silently</div>',
    56, 336, 124, "red", "var(--red)");
  S.character(1, "frustrated", { cy: 418 });
  S.caption(1, "the failed call re-entered<br><b>costly reasoning, every run.</b>");

  // ---- panel 3: the fix ----------------------------------------------------
  S.frame(2); S.badge(2, 3);
  S.headline(2, "one prefix later");
  S.screen(2,
    '<div class="label">attribute.event.name</div>' +
    '<div class="sub mono">parsed clean &middot; caught<br>orders 1.1.0&ndash;rc1</div>',
    56, 336, 124);
  S.character(2, "relieved", { cy: 418, noSymbol: true });
  S.caption(2, "fixed, regression-tested,<br><b>and it found a real deploy.</b>");

  [0, 1].forEach(i => S.seqArrow(i, 460));

  S.el("storycap",
    'the first genuinely new bug it filed was against <span class="em">its own authors</span>.',
    'top:690px;');

  window.__sketchDone = true;
});
</script>
</body>
</html>
